[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "liteguard"
version = "0.1.0"
description = "Lightweight, AI-assisted security scanner for secrets and risky code."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
ai = ["anthropic"]
dev = ["pytest"]

[project.scripts]
liteguard = "liteguard.cli:main"

[tool.setuptools]
packages = ["liteguard"]
